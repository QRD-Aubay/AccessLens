# RGAA 4.1.2 — Thématique 1 : Images
# Source : https://accessibilite.numerique.gouv.fr/methode/criteres-et-tests/#1
# Modèle destiné à un agent qui audite une user story et produit un rapport
# de conformité critère par critère.
#
# Structure :
#   theme         : identifiant + libellé de la thématique
#   criteria[]    : liste des 9 critères de la thématique Images
#     id          : ex. "1.1"
#     question    : question de conformité (formulation RGAA)
#     scope       : cas d'usage / types d'images concernés
#     applies_when: heuristique pour décider si le critère s'applique à la story
#     tests[]     : sous-tests officiels
#       id        : ex. "1.1.1"
#       target    : élément(s) HTML/ARIA visé(s)
#       question  : question du test
#       conditions: liste des conditions à vérifier (OU / ET selon `logic`)
#       logic     : "any" (au moins une) | "all" (toutes)
#       method[]  : étapes de la méthodologie officielle
#     special_cases   : cas particuliers (non applicable, etc.)
#     technical_notes : notes techniques utiles à l'audit
#     wcag        : critères WCAG 2.1 associés
#     en301549    : clauses EN 301 549

theme:
  id: "1"
  label: "Images"

criteria:

  - id: "1.1"
    question: "Chaque image porteuse d'information a-t-elle une alternative textuelle ?"
    scope: "Images porteuses d'information (<img>, role=img, <area>, <input type=image>, <svg>, <object type=image/…>, <embed type=image/…>, <canvas>)."
    applies_when: "La story mentionne l'affichage d'une image véhiculant une information (illustration métier, icône fonctionnelle, graphique, photo produit, image cliquable, bouton image, CAPTCHA hors 1.4/1.5, etc.)."
    tests:
      - id: "1.1.1"
        target: "<img> ou élément avec role=\"img\""
        question: "L'image porteuse d'information a-t-elle une alternative textuelle ?"
        logic: "any"
        conditions:
          - "Texte associé via aria-labelledby"
          - "Contenu de aria-label"
          - "Contenu de l'attribut alt (uniquement pour <img>)"
          - "Contenu de l'attribut title (uniquement pour <img>)"
        method:
          - "Repérer les <img> et éléments role=\"img\"."
          - "Déterminer si l'image est porteuse d'information."
          - "Vérifier la présence d'au moins une alternative textuelle."
      - id: "1.1.2"
        target: "<area> d'image réactive"
        question: "Chaque zone d'image réactive porteuse d'information a-t-elle une alternative textuelle ?"
        logic: "any"
        conditions: ["aria-label", "alt"]
      - id: "1.1.3"
        target: "<input type=\"image\">"
        question: "Chaque bouton image a-t-il une alternative textuelle ?"
        logic: "any"
        conditions: ["aria-labelledby", "aria-label", "alt", "title"]
      - id: "1.1.4"
        target: "<img ismap>"
        question: "Chaque zone cliquable d'une image réactive côté serveur est-elle doublée d'un mécanisme utilisable quel que soit le dispositif de pointage ?"
        logic: "all"
        conditions:
          - "Présence d'un lien / composant équivalent menant aux mêmes ressources que le clic image."
      - id: "1.1.5"
        target: "<svg>"
        question: "L'image vectorielle porteuse d'information a-t-elle role=\"img\" ET une alternative textuelle ?"
        logic: "all"
        conditions:
          - "role=\"img\" présent"
          - "Au moins une alt parmi : <title> enfant, aria-labelledby, aria-label"
      - id: "1.1.6"
        target: "<object type=\"image/…\">"
        question: "L'image objet porteuse d'information vérifie-t-elle une des conditions ?"
        logic: "any"
        conditions:
          - "role=\"img\" + alternative textuelle (aria-labelledby, aria-label ou title)"
          - "Lien/bouton adjacent vers un contenu alternatif"
          - "Mécanisme permettant de remplacer <object> par un contenu alternatif"
      - id: "1.1.7"
        target: "<embed type=\"image/…\">"
        question: "Idem 1.1.6 pour <embed>."
        logic: "any"
        conditions:
          - "role=\"img\" + alternative textuelle"
          - "Lien/bouton adjacent vers contenu alternatif"
          - "Mécanisme de remplacement par contenu alternatif"
      - id: "1.1.8"
        target: "<canvas>"
        question: "Idem 1.1.6 pour <canvas>, avec possibilité de contenu alternatif entre <canvas>…</canvas>."
        logic: "any"
        conditions:
          - "role=\"img\" + aria-label/aria-labelledby"
          - "Contenu alternatif entre <canvas> et </canvas>"
          - "Lien/bouton adjacent vers contenu alternatif"
          - "Mécanisme de remplacement"
    wcag: ["1.1.1 (A)"]
    en301549: ["9.1.1.1"]

  - id: "1.2"
    question: "Chaque image de décoration est-elle correctement ignorée par les technologies d'assistance ?"
    scope: "Images purement décoratives sans légende."
    applies_when: "La story inclut des visuels ornementaux (fond, séparateur, icône redondante à un libellé texte adjacent, illustration purement esthétique)."
    tests:
      - id: "1.2.1"
        target: "<img> décorative sans légende"
        logic: "any"
        conditions:
          - "alt=\"\" ET aucun aria-labelledby/aria-label/title"
          - "aria-hidden=\"true\" ou role=\"presentation\""
      - id: "1.2.2"
        target: "<area> sans href (décorative)"
        logic: "any"
        conditions:
          - "alt=\"\" ET aucun aria-labelledby/aria-label/title"
          - "aria-hidden=\"true\" ou role=\"presentation\""
      - id: "1.2.3"
        target: "<object type=\"image/…\"> décorative sans légende"
        logic: "all"
        conditions:
          - "aria-hidden=\"true\""
          - "Aucune alternative textuelle"
          - "Aucun contenu alternatif entre <object>…</object>"
      - id: "1.2.4"
        target: "<svg> décoratif sans légende"
        logic: "all"
        conditions:
          - "aria-hidden=\"true\""
          - "Pas d'alternative textuelle sur <svg> ni ses enfants"
          - "<title> et <desc> absents ou vides"
          - "Pas d'attribut title sur <svg> ni ses enfants"
      - id: "1.2.5"
        target: "<canvas> décoratif sans légende"
        logic: "all"
        conditions:
          - "aria-hidden=\"true\""
          - "Aucune alternative textuelle"
          - "Aucun contenu alternatif entre <canvas>…</canvas>"
      - id: "1.2.6"
        target: "<embed type=\"image/…\"> décoratif sans légende"
        logic: "all"
        conditions:
          - "aria-hidden=\"true\""
          - "Aucune alternative textuelle"
    technical_notes:
      - "Si l'image a une légende, le critère 1.2 est non applicable (voir 1.9)."
      - "role=\"presentation\" (ou role=\"none\") accepté sur image décorative / area décorative."
    wcag: ["1.1.1 (A)", "4.1.2 (A)"]
    en301549: ["9.1.1.1", "9.4.1.2"]

  - id: "1.3"
    question: "Pour chaque image porteuse d'information ayant une alternative textuelle, cette alternative est-elle pertinente (hors CAPTCHA/image-test) ?"
    scope: "Toutes images porteuses d'information avec alternative."
    applies_when: "Une alternative textuelle est prévue ou existe dans la story."
    tests:
      - id: "1.3.1"
        target: "<img> ou role=\"img\""
        check: "Pertinence de alt / title / aria-label / aria-labelledby."
      - id: "1.3.2"
        target: "<area>"
        check: "Pertinence de alt / title / aria-label / aria-labelledby."
      - id: "1.3.3"
        target: "<input type=\"image\">"
        check: "Pertinence de alt / title / aria-label / aria-labelledby."
      - id: "1.3.4"
        target: "<object type=\"image/…\">"
        check: "Pertinence de title / aria-label / aria-labelledby / contenu alternatif."
      - id: "1.3.5"
        target: "<embed type=\"image/…\">"
        check: "Pertinence de title / aria-label / aria-labelledby / contenu alternatif."
      - id: "1.3.6"
        target: "<svg>"
        check: "Pertinence de <title> / aria-label / aria-labelledby."
      - id: "1.3.7"
        target: "<canvas>"
        check: "Pertinence de title / aria-label / aria-labelledby / contenu alternatif."
      - id: "1.3.8"
        target: "<canvas> avec contenu alternatif entre balises"
        check: "Le contenu alternatif est correctement restitué par les technologies d'assistance."
      - id: "1.3.9"
        target: "Toute image avec alternative"
        check: "L'alternative textuelle est courte et concise (hors cas particuliers)."
    special_cases:
      - "CAPTCHA et image-test : non applicable, traité par 1.4."
    wcag: ["1.1.1 (A)", "4.1.2 (A)"]
    en301549: ["9.1.1.1", "9.4.1.2"]

  - id: "1.4"
    question: "Pour chaque image CAPTCHA ou image-test avec alternative, l'alternative permet-elle d'identifier la nature et la fonction de l'image ?"
    scope: "Images utilisées comme CAPTCHA ou image-test."
    applies_when: "La story implique un CAPTCHA visuel ou une image-test (vérification humaine, question par image, etc.)."
    tests:
      - id: "1.4.1"
        target: "<img> CAPTCHA/image-test"
        check: "Pertinence alt / title / aria-label / aria-labelledby (identifie nature et fonction)."
      - id: "1.4.2"
        target: "<area> CAPTCHA/image-test"
        check: "Pertinence des alternatives."
      - id: "1.4.3"
        target: "<input type=\"image\"> CAPTCHA/image-test"
        check: "Pertinence des alternatives."
      - id: "1.4.4"
        target: "<object type=\"image/…\"> CAPTCHA/image-test"
        check: "Pertinence des alternatives ou du contenu alternatif."
      - id: "1.4.5"
        target: "<embed type=\"image/…\"> CAPTCHA/image-test"
        check: "Pertinence des alternatives ou du contenu alternatif."
      - id: "1.4.6"
        target: "<svg> CAPTCHA/image-test"
        check: "Pertinence des alternatives."
      - id: "1.4.7"
        target: "<canvas> CAPTCHA/image-test"
        check: "Pertinence des alternatives ou du contenu alternatif."
    wcag: ["1.1.1 (A)"]
    en301549: ["9.1.1.1"]

  - id: "1.5"
    question: "Pour chaque image utilisée comme CAPTCHA, une solution d'accès alternatif au contenu ou à la fonction est-elle présente ?"
    scope: "CAPTCHA graphiques."
    applies_when: "La story mentionne un CAPTCHA graphique protégeant une fonctionnalité (formulaire, inscription, etc.)."
    tests:
      - id: "1.5.1"
        target: "Images CAPTCHA (<img>, <area>, <object>, <embed>, <svg>, <canvas>, role=img)"
        logic: "any"
        conditions:
          - "Autre forme de CAPTCHA non graphique (ex. audio)"
          - "Autre solution d'accès à la fonctionnalité sécurisée par le CAPTCHA"
      - id: "1.5.2"
        target: "<input type=\"image\"> utilisé comme CAPTCHA"
        logic: "any"
        conditions:
          - "Autre forme de CAPTCHA non graphique"
          - "Autre solution d'accès à la fonctionnalité"
    wcag: ["1.1.1 (A)"]
    en301549: ["9.1.1.1"]

  - id: "1.6"
    question: "Chaque image porteuse d'information a-t-elle, si nécessaire, une description détaillée ?"
    scope: "Images complexes (graphiques, schémas, plans, infographies, cartes)."
    applies_when: "La story décrit une image dont le sens ne peut pas tenir dans une alternative courte (données chiffrées, processus, schéma métier)."
    tests:
      - id: "1.6.1"
        target: "<img>"
        logic: "any"
        conditions:
          - "Attribut longdesc pointant vers une page/emplacement contenant la description détaillée"
          - "Alternative textuelle qui référence une description détaillée adjacente"
          - "Lien ou bouton adjacent vers la description détaillée"
      - id: "1.6.2"
        target: "<object type=\"image/…\">"
        logic: "any"
        conditions:
          - "longdesc"
          - "Alternative référençant une description adjacente"
          - "Lien/bouton adjacent"
      - id: "1.6.3"
        target: "<embed type=\"image/…\">"
        logic: "any"
        conditions: ["longdesc", "Alternative référençant description adjacente", "Lien/bouton adjacent"]
      - id: "1.6.4"
        target: "<input type=\"image\">"
        logic: "any"
        conditions:
          - "longdesc"
          - "Alternative référençant description adjacente"
          - "Lien/bouton adjacent"
          - "aria-describedby vers passage faisant office de description détaillée"
      - id: "1.6.5"
        target: "<svg>"
        logic: "any"
        conditions:
          - "aria-label contenant l'alt + référence à une description détaillée adjacente"
          - "aria-labelledby (un passage alt court + un passage description détaillée)"
          - "aria-describedby vers passage faisant office de description détaillée"
          - "Lien/bouton adjacent"
      - id: "1.6.6"
        target: "<svg> avec aria-label / aria-labelledby / aria-describedby"
        check: "La référence à la description détaillée et la description associée sont correctement restituées par les technologies d'assistance."
      - id: "1.6.7"
        target: "<canvas>"
        logic: "any"
        conditions:
          - "aria-label contenant alt + référence à description adjacente"
          - "aria-labelledby (alt + description)"
          - "Contenu textuel entre <canvas>…</canvas> référençant une description adjacente"
          - "Contenu textuel entre <canvas>…</canvas> faisant office de description détaillée"
          - "Lien/bouton adjacent"
      - id: "1.6.8"
        target: "<canvas> avec référence adjacente"
        check: "La référence est correctement restituée par les technologies d'assistance."
      - id: "1.6.9"
        target: "Toute image avec aria-describedby"
        check: "aria-describedby associe bien la description détaillée (id valide, contenu restitué)."
      - id: "1.6.10"
        target: "Élément role=\"img\""
        logic: "any"
        conditions:
          - "aria-label alt + référence description adjacente"
          - "aria-labelledby (alt + description)"
          - "aria-describedby vers description détaillée"
          - "Lien/bouton adjacent"
    technical_notes:
      - "longdesc obsolète en HTML5 : ne s'applique qu'aux versions HTML antérieures."
      - "aria-describedby peu supporté sur <img>/<object>/<embed>/<canvas> ; préférer lien adjacent."
    wcag: ["1.1.1 (A)"]
    en301549: ["9.1.1.1"]

  - id: "1.7"
    question: "Pour chaque image porteuse d'information ayant une description détaillée, cette description est-elle pertinente ?"
    scope: "Images à description détaillée."
    applies_when: "Une description détaillée est prévue (voir 1.6)."
    tests:
      - id: "1.7.1"
        target: "<img>"
        check: "Pertinence via longdesc / alt-référence / lien-bouton adjacent / aria-describedby."
      - id: "1.7.2"
        target: "<input type=\"image\">"
        check: "Pertinence via alt-référence / lien-bouton / aria-describedby."
      - id: "1.7.3"
        target: "<object type=\"image/…\">"
        check: "Pertinence via alt-référence / description adjacente / lien-bouton / aria-describedby."
      - id: "1.7.4"
        target: "<embed type=\"image/…\">"
        check: "Idem 1.7.3."
      - id: "1.7.5"
        target: "<svg>"
        check: "Pertinence via alt-référence / <desc>/<title> / description adjacente / lien-bouton / aria-describedby."
      - id: "1.7.6"
        target: "<canvas>"
        check: "Pertinence via alt-référence / contenu <canvas>…</canvas> / description adjacente / lien-bouton / aria-describedby."
    wcag: ["1.1.1 (A)"]
    en301549: ["9.1.1.1"]

  - id: "1.8"
    question: "Chaque image texte porteuse d'information, en l'absence d'un mécanisme de remplacement, doit si possible être remplacée par du texte stylé. Cette règle est-elle respectée (hors cas particuliers) ?"
    scope: "Images texte (texte composé graphiquement dans une image bitmap ou vectorielle non-<text>)."
    applies_when: "La story prévoit d'afficher du texte via une image (bannière, bouton graphique avec libellé, titre en image)."
    tests:
      - id: "1.8.1"
        target: "<img> ou role=\"img\" image texte"
        logic: "any"
        conditions:
          - "Il existe un mécanisme de remplacement (permet d'afficher du texte réel équivalent)"
          - "L'image contient un texte avec un effet graphique non reproductible en CSS"
      - id: "1.8.2"
        target: "<input type=\"image\"> image texte"
        logic: "any"
        conditions: ["Mécanisme de remplacement", "Effet graphique non reproductible en CSS"]
      - id: "1.8.3"
        target: "<object type=\"image/…\"> image texte"
        logic: "any"
        conditions: ["Mécanisme de remplacement", "Effet graphique non reproductible en CSS"]
      - id: "1.8.4"
        target: "<embed type=\"image/…\"> image texte"
        logic: "any"
        conditions: ["Mécanisme de remplacement", "Effet graphique non reproductible en CSS"]
      - id: "1.8.5"
        target: "<canvas> image texte"
        logic: "any"
        conditions: ["Mécanisme de remplacement", "Effet graphique non reproductible en CSS"]
      - id: "1.8.6"
        target: "<svg> image texte dont le texte n'est PAS entièrement structuré via <text>"
        logic: "any"
        conditions: ["Mécanisme de remplacement", "Effet graphique non reproductible en CSS"]
    special_cases:
      - "Logo, dénomination commerciale, CAPTCHA, image-test, image dont l'exactitude graphique est essentielle : non applicable."
    technical_notes:
      - "Le texte dans les <svg> structuré en <text> n'est pas concerné (texte réel)."
    wcag: ["1.4.5 (AA)"]
    en301549: ["9.1.4.5"]

  - id: "1.9"
    question: "Chaque légende d'image est-elle, si nécessaire, correctement reliée à l'image correspondante ?"
    scope: "Images pourvues d'une légende adjacente."
    applies_when: "La story prévoit une image avec légende visible (crédit photo, titre de figure, description sous l'image)."
    tests:
      - id: "1.9.1"
        target: "<img>, <input type=\"image\">, role=\"img\" + légende adjacente"
        logic: "all"
        conditions:
          - "Image + légende contenues dans <figure>"
          - "<figure> avec role=\"figure\" ou role=\"group\""
          - "<figure> avec aria-label identique au contenu de la légende"
          - "Légende contenue dans <figcaption>"
      - id: "1.9.2"
        target: "<object type=\"image/…\"> + légende"
        logic: "all"
        conditions:
          - "Image + légende dans <figure>"
          - "role=\"figure\" ou role=\"group\""
          - "aria-label identique à la légende"
          - "Légende dans <figcaption>"
      - id: "1.9.3"
        target: "<embed> + légende"
        logic: "all"
        conditions:
          - "Image + légende dans <figure>"
          - "role=\"figure\" ou role=\"group\""
          - "aria-label identique à la légende"
          - "Légende dans <figcaption>"
      - id: "1.9.4"
        target: "<svg> + légende"
        logic: "all"
        conditions:
          - "Image + légende dans <figure>"
          - "role=\"figure\" ou role=\"group\""
          - "aria-label identique à la légende"
          - "Légende dans <figcaption>"
      - id: "1.9.5"
        target: "<canvas> + légende"
        logic: "all"
        conditions:
          - "Image + légende dans <figure>"
          - "role=\"figure\" ou role=\"group\""
          - "aria-label identique à la légende"
          - "Légende dans <figcaption>"
    technical_notes:
      - "aria-labelledby et aria-describedby non utilisables ici (support insuffisant)."
      - "Les images légendées restent soumises aux critères 1.1 et 1.3."
    wcag: ["1.1.1 (A)", "4.1.2 (A)"]
    en301549: ["9.1.1.1", "9.4.1.2"]

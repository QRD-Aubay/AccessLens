# RGAA 4.1.2 — Thématique 11 : Formulaires
# Source : https://accessibilite.numerique.gouv.fr/methode/criteres-et-tests/#11
# Modèle destiné à un agent qui audite une user story et produit un rapport
# de conformité critère par critère.
#
# Structure :
#   theme         : identifiant + libellé de la thématique
#   criteria[]    : liste des 13 critères de la thématique Formulaires
#     id          : ex. "11.1"
#     question    : question de conformité (formulation RGAA)
#     scope       : cas d'usage / éléments concernés
#     applies_when: heuristique pour décider si le critère s'applique à la story
#     tests[]     : sous-tests officiels
#       id        : ex. "11.1.1"
#       target    : élément(s) HTML/ARIA visé(s)
#       question  : question du test
#       conditions: liste des conditions à vérifier
#       logic     : "any" (au moins une) | "all" (toutes)
#     special_cases   : cas particuliers (non applicable, etc.)
#     technical_notes : notes techniques utiles à l'audit
#     wcag        : critères WCAG 2.1 associés
#     en301549    : clauses EN 301 549

theme:
  id: "11"
  label: "Formulaires"

criteria:

  - id: "11.1"
    question: "Chaque champ de formulaire a-t-il une étiquette ?"
    scope: "Tous les champs de saisie de formulaire : <input> (hors submit/reset/button/image/hidden), <select>, <textarea>, éléments avec role=\"textbox\"/\"combobox\"/\"listbox\"/\"checkbox\"/\"radio\"/\"switch\"/\"spinbutton\"/\"searchbox\"/\"slider\"."
    applies_when: "La story décrit la présence d'un ou plusieurs champs de saisie dans un formulaire."
    tests:
      - id: "11.1.1"
        target: "champ de formulaire"
        question: "Le champ possède-t-il une étiquette accessible ?"
        logic: "any"
        conditions:
          - "aria-labelledby référençant un passage de texte identifié"
          - "aria-label"
          - "<label for=\"…\"> associé au champ"
          - "attribut title"
          - "Bouton adjacent fournissant étiquette visible ET label caché ou aria-label/aria-labelledby/title fournissant nom accessible"
      - id: "11.1.2"
        target: "champ associé à <label for=\"…\">"
        question: "Le champ et son <label> sont-ils correctement liés ?"
        logic: "all"
        conditions:
          - "Le champ possède un id"
          - "La valeur de for est identique à la valeur de id"
      - id: "11.1.3"
        target: "champ avec étiquette non visible ou non accolée (aria-label, aria-labelledby distant)"
        question: "La nature de la saisie attendue est-elle compréhensible ?"
        logic: "any"
        conditions:
          - "Attribut title dont le contenu permet de comprendre la saisie attendue"
          - "Passage de texte accolé devenant visible à la prise de focus"
          - "Passage de texte visible accolé permettant de comprendre la saisie attendue"
    wcag: ["1.3.1 (A)", "2.4.6 (AA)", "3.3.2 (A)", "4.1.2 (A)"]
    en301549: ["9.1.3.1", "9.2.4.6", "9.3.3.2", "9.4.1.2"]

  - id: "11.2"
    question: "Chaque étiquette associée à un champ est-elle pertinente (hors cas particuliers) ?"
    scope: "Étiquettes de champs de formulaire (label, title, aria-label, aria-labelledby, bouton adjacent servant d'étiquette)."
    applies_when: "La story prévoit ou décrit une étiquette (visible ou non) pour au moins un champ."
    tests:
      - id: "11.2.1"
        target: "<label>"
        check: "Le contenu du <label> permet de connaître la fonction exacte du champ."
      - id: "11.2.2"
        target: "champ avec attribut title"
        check: "Le contenu de title permet de connaître la fonction exacte."
      - id: "11.2.3"
        target: "champ avec aria-label"
        check: "Le contenu de aria-label permet de connaître la fonction exacte."
      - id: "11.2.4"
        target: "champ avec aria-labelledby"
        check: "Le passage de texte référencé permet de connaître la fonction exacte."
      - id: "11.2.5"
        target: "champ avec intitulé visible (label in name)"
        question: "Le nom accessible contient-il l'intitulé visible ?"
        logic: "all"
        conditions:
          - "Si aria-label présent : contient au moins l'intitulé visible"
          - "Si aria-labelledby présent : le passage contient au moins l'intitulé visible"
          - "Si title présent : contient au moins l'intitulé visible"
          - "Si <label> présent : contient au moins l'intitulé visible"
      - id: "11.2.6"
        target: "bouton adjacent servant d'étiquette au champ"
        check: "Le contenu visible du bouton permet de connaître la fonction exacte du champ."
    special_cases:
      - "Ponctuation et majuscules dans l'intitulé visible peuvent être ignorées dans le nom accessible."
      - "Texte utilisé comme symbole (ex. \"B\" pour gras, \">\" pour suivant) : le nom accessible doit exprimer la fonction, pas le symbole."
      - "Symboles mathématiques peuvent être repris littéralement."
    wcag: ["2.4.6 (AA)", "2.5.3 (A)", "3.3.2 (A)"]
    en301549: ["9.2.4.6", "9.2.5.3", "9.3.3.2"]

  - id: "11.3"
    question: "Dans chaque formulaire, chaque étiquette de champ ayant la même fonction et répétée est-elle cohérente ?"
    scope: "Étiquettes répétées dans une page ou un ensemble de pages."
    applies_when: "La story implique la répétition d'un même champ (ex. adresse de livraison et de facturation, formulaire multi-étapes, formulaire réutilisé sur plusieurs pages)."
    tests:
      - id: "11.3.1"
        target: "champs de même fonction répétés dans une page"
        check: "Les étiquettes sont cohérentes (permettent de comprendre des saisies de nature identique)."
      - id: "11.3.2"
        target: "champs de même fonction répétés dans un ensemble de pages"
        check: "Les étiquettes sont cohérentes d'une page à l'autre."
    wcag: ["3.2.4 (AA)"]
    en301549: ["9.3.2.4"]

  - id: "11.4"
    question: "Dans chaque formulaire, chaque étiquette et son champ associé sont-ils accolés (hors cas particuliers) ?"
    scope: "Positionnement visuel étiquette / champ."
    applies_when: "La story décrit la disposition visuelle des étiquettes et champs."
    tests:
      - id: "11.4.1"
        target: "tout champ de formulaire"
        check: "Le champ est accolé à son étiquette."
      - id: "11.4.2"
        target: "champ hors checkbox / radio / switch"
        logic: "any"
        conditions:
          - "Sens LTR : étiquette immédiatement au-dessus ou à gauche du champ"
          - "Sens RTL : étiquette immédiatement au-dessus ou à droite du champ"
      - id: "11.4.3"
        target: "<input type=\"checkbox\"|\"radio\">, role=\"checkbox\"|\"radio\"|\"switch\""
        logic: "any"
        conditions:
          - "Sens LTR : étiquette immédiatement au-dessous ou à droite du champ"
          - "Sens RTL : étiquette immédiatement au-dessous ou à gauche du champ"
    special_cases:
      - "Étiquette mélangeant portions RTL et LTR : 11.4.2/11.4.3 non applicables."
      - "Formulaire mélangeant libellés LTR et RTL : 11.4.2/11.4.3 non applicables."
      - "Champs radio/checkbox/switch non présentés visuellement comme tels : 11.4.3 non applicable."
    wcag: ["3.3.2 (A)"]
    en301549: ["9.3.3.2"]

  - id: "11.5"
    question: "Dans chaque formulaire, les champs de même nature sont-ils regroupés, si nécessaire ?"
    scope: "Groupes de champs de même nature (radios, checkboxes, sous-champs d'adresse, etc.)."
    applies_when: "La story décrit plusieurs champs traitant de la même information (ex. boutons radio d'un choix unique, cases d'options, adresse en plusieurs champs)."
    tests:
      - id: "11.5.1"
        target: "champs de même nature"
        logic: "any"
        conditions:
          - "Regroupés dans <fieldset>"
          - "Regroupés dans un élément avec role=\"group\""
          - "Radios regroupés dans role=\"radiogroup\" ou role=\"group\""
    wcag: ["1.3.1 (A)", "3.3.2 (A)"]
    en301549: ["9.1.3.1", "9.3.3.2"]

  - id: "11.6"
    question: "Dans chaque formulaire, chaque regroupement de champs de même nature a-t-il une légende ?"
    scope: "Groupes de champs de même nature."
    applies_when: "Un regroupement 11.5 est présent."
    tests:
      - id: "11.6.1"
        target: "regroupement de champs"
        logic: "any"
        conditions:
          - "Si <fieldset> : contient <legend>"
          - "Si role=\"group\" ou role=\"radiogroup\" : possède aria-label ou aria-labelledby"
          - "Sinon, chaque champ possède title / aria-label / aria-labelledby / aria-describedby indiquant l'appartenance au groupe"
    wcag: ["1.3.1 (A)", "3.3.2 (A)"]
    en301549: ["9.1.3.1", "9.3.3.2"]

  - id: "11.7"
    question: "Dans chaque formulaire, chaque légende associée à un regroupement de champs de même nature est-elle pertinente ?"
    scope: "Légendes des regroupements (voir 11.6)."
    applies_when: "Un regroupement avec légende est présent."
    tests:
      - id: "11.7.1"
        target: "légende de regroupement (<legend>, aria-label, aria-labelledby)"
        check: "Le texte de la légende est pertinent (identifie clairement la nature commune des champs)."
    wcag: ["1.3.1 (A)", "3.3.2 (A)"]
    en301549: ["9.1.3.1", "9.3.3.2"]

  - id: "11.8"
    question: "Dans chaque formulaire, les items de même nature d'une liste de choix sont-ils regroupés de manière pertinente ?"
    scope: "<select> avec options familiarisables."
    applies_when: "La story mentionne une liste déroulante contenant des options catégorisables (ex. pays par continent, produits par famille)."
    tests:
      - id: "11.8.1"
        target: "<select>"
        check: "Les items de même nature sont regroupés dans <optgroup>, si nécessaire."
      - id: "11.8.2"
        target: "<optgroup>"
        check: "Possède un attribut label."
      - id: "11.8.3"
        target: "<optgroup label=\"…\">"
        check: "Le contenu de label est pertinent."
    technical_notes:
      - "role=\"listbox\" ne permet pas de créer des groupes d'options : une liste nécessitant un regroupement structurée via role=\"listbox\" sera non conforme à 11.8."
    wcag: ["1.3.1 (A)"]
    en301549: ["9.1.3.1"]

  - id: "11.9"
    question: "Dans chaque formulaire, l'intitulé de chaque bouton est-il pertinent (hors cas particuliers) ?"
    scope: "Boutons de formulaire : <button>, <input type=\"submit|reset|button|image\">, role=\"button\"."
    applies_when: "La story inclut au moins un bouton (envoi, réinitialisation, action)."
    tests:
      - id: "11.9.1"
        target: "boutons de formulaire"
        question: "L'intitulé du bouton est-il pertinent ?"
        logic: "all"
        conditions:
          - "Si aria-label présent : pertinent"
          - "Si aria-labelledby présent : le passage lié est pertinent"
          - "Si value (<input type=\"submit|reset|button\">) : pertinent"
          - "Si contenu de <button> : pertinent"
          - "Si alt (<input type=\"image\">) : pertinent"
          - "Si title : pertinent"
      - id: "11.9.2"
        target: "bouton avec intitulé visible (label in name)"
        question: "Le nom accessible contient-il l'intitulé visible ?"
        logic: "all"
        conditions:
          - "aria-label (si présent) contient au moins l'intitulé visible"
          - "aria-labelledby (si présent) contient au moins l'intitulé visible"
          - "value (si présent) contient au moins l'intitulé visible"
          - "Contenu <button> contient au moins l'intitulé visible"
          - "alt (input type=image) contient au moins l'intitulé visible"
          - "title contient au moins l'intitulé visible"
    special_cases:
      - "Ponctuation et majuscules peuvent être ignorées dans le nom accessible."
      - "Symbole visuel : le nom accessible exprime la fonction (ex. \">\" → \"Suivant\")."
    wcag: ["2.5.3 (A)", "4.1.2 (A)"]
    en301549: ["9.2.5.3", "9.4.1.2"]

  - id: "11.10"
    question: "Dans chaque formulaire, le contrôle de saisie est-il utilisé de manière pertinente (hors cas particuliers) ?"
    scope: "Champs obligatoires, contraintes de format/type, messages d'erreur."
    applies_when: "La story mentionne des champs obligatoires, des formats/types de données attendus, ou des messages d'erreur."
    tests:
      - id: "11.10.1"
        target: "champs obligatoires (préalablement à la validation)"
        logic: "any"
        conditions:
          - "Indication visible du caractère obligatoire identifiant nommément le champ"
          - "Le champ possède aria-required=\"true\" ou required"
      - id: "11.10.2"
        target: "champ avec aria-required=\"true\" ou required"
        logic: "any"
        conditions:
          - "Indication obligatoire visible située dans l'étiquette associée"
          - "Indication obligatoire visible située dans le passage de texte associé"
      - id: "11.10.3"
        target: "message d'erreur \"champ obligatoire manquant\""
        logic: "any"
        conditions:
          - "Message d'erreur visible identifiant nommément le champ concerné"
          - "Le champ obligatoire dispose de aria-invalid=\"true\""
      - id: "11.10.4"
        target: "champ avec aria-invalid=\"true\" (obligatoire)"
        logic: "any"
        conditions:
          - "Message d'erreur visible situé dans l'étiquette associée"
          - "Message d'erreur visible situé dans le passage de texte associé"
      - id: "11.10.5"
        target: "instructions/indications de type ou format (préalablement à la validation)"
        logic: "any"
        conditions:
          - "Instruction visible identifiant nommément le champ concerné"
          - "Instruction visible dans l'étiquette ou passage de texte associé"
      - id: "11.10.6"
        target: "message d'erreur portant sur le type/format"
        logic: "any"
        conditions:
          - "Message d'erreur visible identifiant nommément le champ concerné"
          - "Le champ possède aria-invalid=\"true\""
      - id: "11.10.7"
        target: "champ avec aria-invalid=\"true\" (format)"
        logic: "any"
        conditions:
          - "Instruction/indication visible située dans le <label> associé"
          - "Instruction/indication visible située dans le passage de texte associé"
    special_cases:
      - "11.10.1 et 11.10.2 non applicables si le formulaire ne comporte qu'un seul champ."
      - "11.10.1 et 11.10.2 non applicables si les champs OPTIONNELS sont indiqués visiblement dans le <label> ou la légende (et required/aria-required reste sur les non facultatifs)."
      - "Si tous les champs sont obligatoires, 11.10.1 et 11.10.2 restent applicables."
    technical_notes:
      - "Formulaire majoritairement obligatoire accepté si : message visible en haut \"tous obligatoires sauf…\", mention \"facultatif\" visible dans libellé/légende, required/aria-required sur les non facultatifs."
    wcag: ["3.3.1 (A)", "3.3.2 (A)"]
    en301549: ["9.3.3.1", "9.3.3.2"]

  - id: "11.11"
    question: "Dans chaque formulaire, le contrôle de saisie est-il accompagné, si nécessaire, de suggestions facilitant la correction des erreurs ?"
    scope: "Messages d'erreur de saisie."
    applies_when: "La story implique des règles de saisie (format, type, valeur attendue) et affiche des erreurs."
    tests:
      - id: "11.11.1"
        target: "message d'erreur"
        check: "Les types et formats de données attendus sont suggérés, si nécessaire."
      - id: "11.11.2"
        target: "message d'erreur"
        check: "Des exemples de valeurs attendues sont suggérés, si nécessaire."
    technical_notes:
      - "Les types HTML5 (email, url…) et l'attribut pattern avec title personnalisable (Constraint Validation API) valident le critère."
    wcag: ["3.3.3 (AA)"]
    en301549: ["9.3.3.3"]

  - id: "11.12"
    question: "Pour chaque formulaire qui modifie/supprime des données, transmet des réponses à un test/examen, ou dont la validation a des conséquences financières ou juridiques, les données saisies peuvent-elles être modifiées, mises à jour ou récupérées ?"
    scope: "Formulaires sensibles (modification/suppression de données, conséquences financières/juridiques, tests/examens)."
    applies_when: "La story implique une action à conséquences (paiement, suppression de compte, modification de données personnelles, examen, envoi juridique)."
    tests:
      - id: "11.12.1"
        target: "formulaire sensible"
        logic: "any"
        conditions:
          - "Possibilité de modifier ou annuler les données/actions après validation"
          - "Vérification et correction possibles avant validation d'un formulaire multi-étapes"
          - "Mécanisme de confirmation explicite (checkbox, étape supplémentaire)"
      - id: "11.12.2"
        target: "formulaire modifiant/supprimant des données financières, juridiques ou personnelles"
        logic: "any"
        conditions:
          - "Mécanisme permettant de récupérer les données supprimées ou modifiées"
          - "Mécanisme de demande de confirmation explicite (champ dédié ou étape supplémentaire)"
    wcag: ["3.3.4 (AA)"]
    en301549: ["9.3.3.4"]

  - id: "11.13"
    question: "La finalité d'un champ de saisie peut-elle être déduite pour faciliter le remplissage automatique avec les données de l'utilisateur ?"
    scope: "Champs se rapportant à des informations personnelles standard de l'utilisateur (nom, prénom, email, téléphone, adresse, carte bancaire, etc.)."
    applies_when: "La story décrit des champs collectant des informations utilisateur figurant dans la liste WCAG 1.3.5 (field name)."
    tests:
      - id: "11.13.1"
        target: "champ portant sur une information utilisateur standard"
        logic: "all"
        conditions:
          - "Le champ possède un attribut autocomplete"
          - "La valeur d'autocomplete figure dans la liste des field names WCAG 2.1 / HTML 5.2"
          - "La valeur d'autocomplete est pertinente au regard de l'information attendue"
    technical_notes:
      - "La valeur peut être simple (\"name\", \"street-address\") ou composée (\"shipping name\", \"section-software shipping street-address\")."
      - "\"section-*\" définit le scope ; \"shipping\"/\"billing\" définissent le hint set."
    wcag: ["1.3.5 (AA)"]
    en301549: ["9.1.3.5"]
